name: Production CI Pipeline

on:
  push:
    branches: [ main, prod-conversion ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-test:
    name: Backend Build & Unit Tests (Java 17 / Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run Backend Tests
        working-directory: backend
        run: mvn clean test

  frontend-build-test:
    name: Frontend Lint & Production Bundle Build (React 19 / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking
        run: npm run lint

      - name: Production Bundle Build
        run: npm run build
