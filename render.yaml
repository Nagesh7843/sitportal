databases:
  - name: sitportaldb
    databaseName: sitportaldb
    user: postgres
    plan: free

services:
  - type: web
    name: sit-cse-portal-backend
    env: java
    plan: free
    buildCommand: "cd backend && mvn clean package -DskipTests"
    startCommand: "java -jar backend/target/sit-cse-portal-backend-*.jar"
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: sitportaldb
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: sitportaldb
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: sitportaldb
          property: password
      - key: JWT_SECRET
        generateValue: true
